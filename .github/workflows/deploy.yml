name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            cd /home/u633781435/domains/your-face-ia.site/laravel
            git pull origin main
            rm -f public/hot ../public_html/hot
            composer install --no-dev --classmap-authoritative
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "✅ Deploy backend completado (sin build frontend - hazlo local)"

  build-frontend:
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Build assets
        run: |
          npm ci
          npm run build
      
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          source: "public/build/*"
          target: "/home/u633781435/domains/your-face-ia.site/laravel/"
          strip_components: 0
