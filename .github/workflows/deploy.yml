name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            cd /home/u633781435/domains/your-face-ia.site/laravel
            git pull origin main
            rm -f public/hot ../public_html/hot
            composer install --no-dev --optimize-autoload
            npm ci
            npm run build
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            cp -r public/build/* ../public_html/build/
            # opcional: desactivar PWA en producción por ahora
            rm -f ../public_html/sw.js ../public_html/manifest.json
            echo "✅ Deploy completado"
