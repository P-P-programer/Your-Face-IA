# Auto PR Workflow

name: Auto PR

on:
  push:
    branches:
      - dev

jobs:
  create_or_keep_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create or keep PR
        uses: actions/github-script@v5
        with:
          github-token: ${{ secrets.GH_PERSONAL_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = await github.pulls.list({ owner, repo });
            if (pr.data.length === 0) {
              await github.pulls.create({
                owner,
                repo,
                title: 'Auto PR from dev to main',
                head: 'dev',
                base: 'main'
              });
            }